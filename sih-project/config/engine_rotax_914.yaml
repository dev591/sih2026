# PRAMANA — engine profile: Rotax 914 F/UL (FALLBACK / VALIDATION)
#
# The documented alternative. Turbocharged four-cylinder boxer, the workhorse
# of tactical and MALE UAVs worldwide. Its value here is that EVERY LIMIT IS
# CITABLE: they come verbatim from EASA Type Certificate Data Sheet E.122.
#
# Two uses:
#   1. If a judge asks "where do your numbers come from" — point at the TCDS.
#   2. Cross-engine transfer demonstration (design doc §7, §13.2): fit the
#      health manifold on the VRDE profile, run UNMODIFIED here, show the
#      residuals stay centred after a small bias correction.
#
# That second use is the whole point of loading a second profile, and it is
# why "a new engine is a config change" has to be true in the code, not just
# in the pitch.

profile:
  id: rotax_914
  name: "Rotax 914 F/UL"
  developer: "BRP-Rotax"
  cycle: spark_ignition        # contrast with the VRDE diesel — tests transfer
  aspiration: turbocharged
  control: carburetted         # dual constant-depression carburettors
  provenance: published
  source: "EASA TCDS E.122"

# ---------------------------------------------------------------------------
# GEOMETRY
# ---------------------------------------------------------------------------
geometry:
  cylinders: 4
  layout: horizontally_opposed   # boxer
  provenance: published
  displacement_m3: 1.2114e-3     # 1211.2 cc
  bore_m: 0.0793
  stroke_m: 0.0613
  compression_ratio: 9.0
  strokes_per_cycle: 4
  gear_ratio: 2.4295             # reduction gearbox — propeller speed != crank speed (keep in sync with propeller.gear_ratio)

# ---------------------------------------------------------------------------
# RATINGS — all published, all time-limited where noted
# ---------------------------------------------------------------------------
ratings:
  provenance: published
  takeoff_power_kW: 84.5         # max 5 minutes — the mission model must track
  takeoff_rpm: 5800              # CUMULATIVE TIME AT RATING, not just instantaneous
  takeoff_time_limit_s: 300
  max_continuous_power_kW: 73.5  # baseline for BSFC and degradation-rate scaling
  max_continuous_rpm: 5500
  idle_rpm: 1400
  critical_altitude_ft: 16000    # provenance: assumed (boost schedule dependent)

# ---------------------------------------------------------------------------
# LIMITS — quoted VERBATIM from EASA TCDS E.122.
# These are the "threshold system" that the twin beats in the §03 chart.
# ---------------------------------------------------------------------------
limits:
  provenance: published
  source: "EASA TCDS E.122"
  cht_C: 135.0                   # cylinder head temperature — the classic alarm.
                                 # Twin fires ~15 min earlier on a fouling injector.
  coolant_exit_C: 120.0
  oil_temp_inlet_C: 130.0        # second-order confirmation for lubrication faults
  oil_pressure_bar:
    min_above_3500rpm: 2.0
    max_above_3500rpm: 5.0
    min_below_3500rpm: 0.8       # SPEED-DEPENDENT — a fixed threshold gets this
                                 # wrong, a twin does not. Good talking point.
    max_cold_start: 7.0          # startup transient the model should reproduce
  airbox_temp_C: 88.0            # intercooler / charge-air health
  manifold_pressure_hPa:
    takeoff: 1350                # boost target; turbo degradation = failure to hold
    max_continuous: 1200
  fuel_pressure_bar_above_airbox: 0.25   # referenced to AIRBOX, not ambient —
                                         # a nice detail to say out loud
  egt_C: null                    # ***THE TCDS PUBLISHES NO EGT LIMIT.***
                                 # EGT on these engines is a trend parameter, not a
                                 # redline parameter. A threshold system has no way
                                 # to use it. This is precisely the information a
                                 # twin exists to exploit. Say this to the panel.

# ---------------------------------------------------------------------------
# FUEL
# ---------------------------------------------------------------------------
fuel:
  type: avgas_100ll
  Q_LHV_J_per_kg: 43.5e+6
  AFR_stoich: 14.7               # spark ignition, stoichiometric gasoline
  provenance: published

  # SPARK-IGNITION MIXTURE SCHEDULE — genuinely correct for THIS engine, unlike
  # the VRDE profile it replaced there. A carburetted/injected SI engine holds
  # a TARGET LAMBDA and derives fuel from measured air mass, because it has a
  # real stoichiometric setpoint to aim at. mvem.py selects this path when
  # profile.cycle == 'spark_ignition'.
  # provenance: assumed — lambda_full=0.98 (near-stoichiometric, typical
  # max-continuous/takeoff margin against detonation and EGT limits);
  # lambda_idle=1.35 (lean, typical partial-power economy cruise setting) —
  # not sourced from a published Rotax fuel map, proposed and verified
  # against backend/gates_check.py.
  lambda_full_power: 0.98
  lambda_idle: 1.35

# ---------------------------------------------------------------------------
# MVEM PARAMETERS
# ---------------------------------------------------------------------------
mvem:
  intake_manifold_volume_m3: 2.5e-3
  R_air_J_per_kgK: 287.05
  gamma_air: 1.40
  cp_air_J_per_kgK: 1005.0
  cp_exhaust_J_per_kgK: 1150.0

  volumetric_efficiency:
    # provenance: assumed. Same correlation form as engine_vrde_180.yaml —
    # see PRAMANA-DIRECTIVE-2026-09-10.md §1.4. Not gate-verified this
    # session (P0's six gates target the VRDE cruise point); kept here only
    # so MVEM does not crash when this profile is loaded for the
    # cross-engine transfer demo. Recalibrate before relying on it.
    correlation_c0: 0.78
    correlation_c1: 0.04
    correlation_c2: 0.004
    correlation_c3: -0.0002
    scale_nominal: 1.0

  compressor:
    # provenance: assumed — see the VRDE profile's comment. Smaller turbo,
    # scaled down for this engine's ~63-85 kW class. Not gate-verified.
    impeller_diameter_m: 0.055
    psi_max_design: 1.7
    phi_max_design: 0.085
    n_corr_design_rpm: 130000
    c_psi: 2.0
    c_phi: 2.0
    psi_speed_exponent: 0.5
    phi_speed_exponent: 1.0
    efficiency_nominal: 0.70
    scale_nominal: 1.0
    inertia_kgm2: 1.4e-5
    mech_efficiency: 0.98

  turbine:
    # provenance: assumed — see the VRDE profile's comment.
    efficiency_nominal: 0.68
    pressure_ratio_gain: 0.9
    mdot_ex_design_kgps: 0.06

  crankshaft:
    inertia_kgm2: 0.12
    friction_coeff_nominal: 1.0

  thermal:
    head_mass_kg: 2.1
    head_cp_J_per_kgK: 900.0
    fin_area_m2: 0.22
    hA_scale_nominal: 1.0
    coolant_temp_K: 363.15
    cooling: liquid_head_air_cylinder   # 914 is a hybrid-cooled engine
    # provenance: calibrated to the published sea-level take-off rating while
    # holding CHT below the EASA 135 C limit. This is a lumped head-to-coolant
    # conductance, not a claimed Rotax hardware value.
    head_htc_W_per_m2K: 1050.0

  oil:
    # provenance: calibrated. The prior profile omitted this whole block and
    # therefore inherited generic defaults, driving oil to >600 C and pressure
    # close to zero. These parameters retain the same physical oil model used
    # by VRDE (gear-pump flow, viscosity and bearing clearance) and are sized
    # to respect the published EASA pressure/temperature limits at take-off.
    pump_eta_vol: 0.85
    pump_displacement_m3_per_rev: 5.0e-6
    dp_gain_bar_per_unit: 12800
    visc_ref_temp_K: 369.45
    visc_temp_exponent: 1.6
    relief_valve_bar: 7.0
    thermal_mass_kJ_per_K: 4.5
    cooler_gain_W_per_K: 1330.0

  injector:
    discharge_coeff_nominal: 1.0
    n_injectors: 4               # modelled as fuel-delivery gain per cylinder
                                 # even though the real 914 is carburetted

# ---------------------------------------------------------------------------
# PROPELLER
# ---------------------------------------------------------------------------
propeller:
  # provenance: calibrated. The Cp scale is fitted to the published 84.5 kW
  # / 5800 rpm sea-level take-off point. This is a model dynamometer load,
  # not a claim about a specific aircraft's propeller.
  provenance: calibrated
  diameter_m: 1.75
  blades: 3
  cp0: 0.27
  j_max: 1.05
  assumed_tas_mps: 61.2
  gear_ratio: 2.4295             # NOTE: geared — n_prop = N_crank / 2.4295.
                                 # Getting this wrong breaks the rho_5 power
                                 # closure residual silently. It is the single
                                 # most likely transfer bug.

# ---------------------------------------------------------------------------
# PARITY PATH AVAILABILITY
# ---------------------------------------------------------------------------
parity_paths:
  speed_density: true
  compressor_map: true
  fuel_lambda: true
  # The physical engine is throttled, but this deployment has no throttle-plate
  # angle/area or upstream-airbox-pressure channel. A compressible-orifice
  # estimate therefore cannot be computed independently; declaring it true
  # would make rho3 fabricated. Add those sensors before enabling this path.
  intake_restriction: false
  independent_residuals: 2       # n-1, with the 3 instrumented paths above

# Fixed healthy-baseline correction, recorded at 10,000 ft / 72% throttle
# after 120 s with the profile's nominal parameters and fixed per-probe
# tolerances. This is installation calibration, not an adaptive estimate: it
# removes a repeatable healthy offset but cannot follow a subsequent fault.
parity_calibration:
  provenance: calibrated
  reference_condition: "10,000 ft ISA, 72% throttle, 120 s steady-state"
  # RE-COMMISSIONED 2026-09-17 for the 13-element vector (rho12 coolant
  # closure, rho13 head-temperature closure were added that day). Re-run at the
  # SAME reference condition recorded above; channels 1-11 reproduced their
  # committed values to ~1e-11, which is the check that the condition is
  # genuinely reproducible and that these are measurements rather than padding.
  #   rho12 is null: this engine has no coolant loop (hybrid air/liquid), so
  #                  the channel has no sensor and reports nothing.
  #   rho13 = -0.3997 degC: a real healthy offset from the per-probe CHT
  #                  tolerances, which is exactly the repeatable bias this
  #                  baseline exists to remove.
  baseline_rho:
    - -0.0060879194
    - -0.0067183149
    - null
    - 0.1564619179
    - -0.0050572634
    - 0.2095171057
    - -0.0246608686
    - -0.3202600300
    - 0.1354037929
    - 0.0547427178
    - 0.0000000000
    - null
    - -0.3997458156

# ---------------------------------------------------------------------------
# ENVIRONMENT PRESETS
# ---------------------------------------------------------------------------
environment_presets:
  sea_level_isa:
    altitude_ft: 0
    isa_offset_K: 0
  cruise_18k:
    altitude_ft: 18000
    isa_offset_K: 0
  hot_high:
    altitude_ft: 15000
    isa_offset_K: 20
