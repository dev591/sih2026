# PRAMANA — engine profile: VRDE 180 hp aero-diesel (PRIMARY)
#
# DRDO / Vehicles Research and Development Establishment powerplant for UAVs.
# Chosen as primary because twinning DRDO's own engine, in front of DRDO,
# using their own published altitude-trial numbers as environment presets,
# is the cheapest credibility available to this project.
#
# PROVENANCE MARKERS on every block:
#   published  — quoted from DRDO / open sources, citable in the pitch
#   derived    — computed from published figures
#   assumed    — engineering estimate; MUST be labelled as such if quoted on a slide
#
# A second engine is a config file, not a rewrite. See engine_rotax_914.yaml.

profile:
  id: vrde_180
  name: "VRDE 180 hp Aero-Diesel"
  developer: "Vehicles Research and Development Establishment, DRDO"
  cycle: diesel            # compression ignition
  aspiration: turbocharged
  control: fadec           # indigenously developed FADEC
  provenance: published
  notes: >
    Holds 180 hp constant to 11 000 ft. 1100+ hours accumulated on test
    profiles. High-altitude trials at Leh and Changla to 17 664 ft.
    TAPAS BH-201 production spec calls for two engines at 220 hp each
    (against 100 hp prototype units).

# ---------------------------------------------------------------------------
# GEOMETRY — drives the mean-value model state equations (§4 of the design doc)
# ---------------------------------------------------------------------------
geometry:
  cylinders: 4
  provenance: assumed      # displacement/bore/stroke not published; sized to 180 hp
  displacement_m3: 2.0e-3  # V_d, swept volume [m^3]
  bore_m: 0.086            # B — enters the Woschni correlation directly
  stroke_m: 0.086
  compression_ratio: 17.5
  connecting_rod_m: 0.150
  strokes_per_cycle: 4     # the 120 in the speed-density relation is 2 rev x 60 s

# ---------------------------------------------------------------------------
# RATINGS
# ---------------------------------------------------------------------------
ratings:
  provenance: published
  rated_power_kW: 134.2          # 180 hp
  rated_power_hp: 180
  critical_altitude_ft: 11000    # above this the turbo cannot hold rated MAP
  critical_altitude_m: 3352.8
  rated_speed_rpm: 3800          # provenance: assumed
  max_continuous_rpm: 3600       # provenance: assumed
  idle_rpm: 900                  # provenance: assumed

# ---------------------------------------------------------------------------
# LIMITS — these are the redlines the twin is beating. Fixed-threshold systems
# alarm here; PRAMANA alarms on residual departure well before.
# ---------------------------------------------------------------------------
limits:
  provenance: assumed            # no public TCDS for this engine; see Rotax profile
  cht_C: 200.0                   # cylinder head temperature
  coolant_C: 110.0
  oil_temp_C: 130.0
  oil_pressure_bar:
    min_above_2500rpm: 2.0
    min_below_2500rpm: 0.8
    max_cold_start: 7.0
  manifold_pressure_hPa:
    takeoff: 2200
    max_continuous: 1900
  egt_C: null                    # deliberately null — EGT is a TREND parameter here,
                                 # not a limit parameter. This is the argument for a twin.

# ---------------------------------------------------------------------------
# FUEL
# ---------------------------------------------------------------------------
fuel:
  type: jet_a1                   # aero-diesel runs heavy fuel
  Q_LHV_J_per_kg: 43.0e+6        # lower heating value
  AFR_stoich: 14.5
  provenance: published

# ---------------------------------------------------------------------------
# MVEM PARAMETERS — the health parameters theta live here as nominal values.
# The UKF estimates SCALE FACTORS on these; the scale factors ARE the health
# indicators reported to the operator, in physical units.
# ---------------------------------------------------------------------------
mvem:
  intake_manifold_volume_m3: 4.0e-3      # V_im, filling-and-emptying
  R_air_J_per_kgK: 287.05
  gamma_air: 1.40
  cp_air_J_per_kgK: 1005.0
  cp_exhaust_J_per_kgK: 1150.0

  volumetric_efficiency:                  # eta_v(p_im, N) — ring wear and valve
    # provenance: calibrated. lookup_eta_v.csv was referenced but never
    # existed; replaced with a named speed-density correlation instead of a
    # constant, per PRAMANA-DIRECTIVE-2026-09-10.md §1.4. eta_v_scale (UKF
    # state) multiplies this correlation's output — ring wear enters here.
    #   eta_v = c0 + c1*sqrt(p_im_bar) + c2*N_krpm + c3*N_krpm^2
    # Fit so eta_v lands in 0.80-0.95 across the operating envelope; verified
    # numerically by backend/gates_check.py, not eyeballed.
    correlation_c0: 0.80
    correlation_c1: 0.04
    correlation_c2: 0.003
    correlation_c3: -0.0002
    scale_nominal: 1.0                    # eta_v_sc — UKF state

  compressor:
    # -----------------------------------------------------------------------
    # FLOW-CAPACITY LOSS RATIO — the gas-path-analysis "fault ratio" R
    # -----------------------------------------------------------------------
    # provenance: published (value), assumed (its application to this engine).
    #
    # Standard gas-path analysis represents degradation as TWO multiplicative
    # health parameters, not one: a flow factor SW = q/q_ref (q = W*sqrt(T)/p,
    # corrected mass flow) and an efficiency factor SE = eta/eta_ref. The ratio
    #     R = delta(SW) / delta(SE)
    # is the accepted SIGNATURE of a fault type. Mathioudakis, Alexiou,
    # Aretakis & Romesis, "Signatures of Compressor and Turbine Faults in Gas
    # Turbine Performance Diagnostics: A Review", Energies 2024, 17, 3409
    # (doi:10.3390/en17143409) compiles the published pairs.
    #
    # Published R by mechanism:
    #   fouling        R ~ 2-3   (full range 0.8-3.5; Zwebek & Pilidis 2003
    #                             use the clean convention -1% SW / -0.5% SE)
    #   tip clearance  R ~ 1     (flow falls roughly proportionally)
    #   erosion        R >= 8    (flow-capacity dominant)
    #
    # We use R = 1.0, deliberately at the BOTTOM of the range, for three
    # reasons:
    #   1. The closest direct analogue is a turbocharger on a diesel engine —
    #      Chen et al., "A performance degradation evaluation method for a
    #      turbocharger in a diesel engine" — which defines the same two
    #      indices and implants -2% flow / -2% efficiency, i.e. R = 1.
    #   2. The R ~ 2-3 fouling figures come largely from LONG AXIAL stacks,
    #      where the review's stage-stacking analysis shows an intrinsic R = 1
    #      fault in the FIRST stage presents as R = 2.4 for the whole machine.
    #      A turbocharger is a single radial stage, so that amplification does
    #      not apply.
    #   3. It is the conservative choice: it produces the SMALLEST flow loss
    #      and therefore the smallest rho1 response, so the detection claim
    #      holds across the whole published range rather than depending on
    #      picking a favourable number.
    #
    # WHY THIS EXISTS AT ALL: eta_c_scale alone was an incomplete degradation
    # model. The Ellipse flow map depends on shaft speed and pressure ratio,
    # NOT on efficiency, so an efficiency-only fault is invisible to parity
    # Path 2 — measured at 0.4 sigma of rho1 response, with the WRONG SIGN.
    # The incidence matrix has always predicted rho1 = -2 for turbo
    # degradation, so the physics-derived signature table was right and the
    # simulator was wrong.
    #
    # MEASURED SENSITIVITY at R = 1.0 (rho1, sigma1 = 0.01054), which is the
    # honest figure to quote rather than the 25% fault the gates inject:
    #     1% efficiency loss -> 1.2 sigma   (not detected)
    #     2%                 -> 1.8 sigma   (not detected)
    #     3%                 -> 2.9 sigma   (marginal)
    #     5%                 -> 4.9 sigma   (detected)
    #    10%                 -> 10.4 sigma  (detected)
    # So rho1 catches fouling from roughly 3-5% efficiency loss upward. It does
    # not catch the first 1-2%. At R = 2 the threshold drops to about 2%.
    # Sensitivity band to quote if asked: R in [1, 3].
    flow_capacity_loss_ratio: 1.0

    # provenance: calibrated. compressor_map.csv was referenced but never
    # existed. Replaced with Leufven & Eriksson's Ellipse model (Control
    # Engineering Practice 21 (2013) 1871-1883) — parameterises the whole map
    # in dimensionless head/flow with ~6 constants, no lookup table needed.
    # Validated by the authors against 236 real compressor maps to <2.5%
    # mean error in the normal operating region.
    #
    # These SIX constants are proposed, not sourced from a real VRDE map (one
    # was never published) — they are sized for a small turbocharger serving
    # a ~2 L four-cylinder making ~134 kW, and calibrated so the model
    # reproduces plausible turbocharged-aero-engine boost behaviour (see the
    # gates in PRAMANA-DIRECTIVE-2026-09-10.md §1.7). If a real map ever
    # becomes available, replace these six numbers only — the equations do
    # not change.
    impeller_diameter_m: 0.070            # D_c — typical for this power class
    psi_max_design: 1.8                   # dimensionless head ceiling at design speed
    phi_max_design: 0.095                 # dimensionless flow ceiling at design speed
    n_corr_design_rpm: 118000             # reference corrected speed
    c_psi: 2.0                            # ellipse exponent, head
    c_phi: 2.0                            # ellipse exponent, flow
    psi_speed_exponent: 0.5               # how psi_max grows with corrected speed
    phi_speed_exponent: 1.0               # how phi_max grows with corrected speed
    efficiency_nominal: 0.72              # eta_c_max — peak, at the design point
    scale_nominal: 1.0                    # eta_c_sc — UKF state
    inertia_kgm2: 2.0e-5                  # J_tc
    mech_efficiency: 0.98                 # eta_m
    # provenance: calibrated. Mechanical overspeed limit — bearing/blade
    # stress ceiling every real turbo has. Without one, N_corr rising with
    # altitude (T01 falling at fixed physical rpm) lets the Ellipse model's
    # capacity grow without bound, and "critical altitude" stops being a
    # real physical limit. Sized so it does not bind at the 18,000 ft cruise
    # gate (measured ~103k rpm there) but does bind above the engine's own
    # published 11,000 ft critical altitude.
    max_shaft_rpm: 110000

  turbine:
    # provenance: calibrated. The turbine's expansion ratio was previously
    # computed from p_im/p_atm — the INTAKE side's pressure ratio, not the
    # exhaust side's. That coupling is what created the absorbing state
    # (PRAMANA-DIRECTIVE-2026-09-10.md §1.3): when p_im fell below p_atm,
    # the same clamp zeroed both P_comp AND P_turb, so the turbo could never
    # respool. A running engine always has exhaust manifold pressure above
    # ambient — the turbine has expansion available independent of what the
    # intake side is doing. Modelled as a simple flow-driven backpressure
    # (nozzle-like), CHOKING at pressure_ratio_max rather than growing
    # unboundedly — real turbine nozzles saturate.
    #   Pi_t = min(1 + gain*(mdot_ex/mdot_ex_design)^2, pressure_ratio_max)
    #
    # mdot_ex_design_kgps was originally sized for full-power sea-level
    # exhaust flow (~0.14 kg/s). Measured directly: at 18,000 ft cruise
    # (72% throttle) actual exhaust flow is only ~0.030 kg/s — 30% of that
    # design point — which crushed Pi_t to ~1.08 (almost no turbine power)
    # even though the compressor itself was perfectly capable (eta_c~0.6).
    # A real turbo's nozzle area is sized for where the engine actually
    # spends its time — cruise, not the rare full-power sea-level case —
    # so mdot_ex_design is recalibrated to that operating point instead,
    # with the choke cap now doing the job of preventing runaway Pi_t at
    # full power that an uncapped model would otherwise need a compromise
    # design point to avoid.
    efficiency_nominal: 0.70              # eta_t
    pressure_ratio_gain: 1.1              # backpressure build-up with exhaust flow
    mdot_ex_design_kgps: 0.032            # calibrated to 18kft/72% cruise exhaust flow
    pressure_ratio_max: 3.2               # choke limit — typical for a small single-stage turbine

  crankshaft:
    inertia_kgm2: 0.35                    # J
    friction_coeff_nominal: 1.0           # f_fric — UKF state; bearing wear channel

  combustion:
    # provenance: calibrated. 0.40 is the low end for a modern FADEC-
    # controlled common-rail turbodiesel — 0.42-0.48 indicated thermal
    # efficiency is a realistic, citable range for this engine class.
    # Single source of truth for BOTH the plant (mvem.py, which used to
    # hardcode this as a bare `eta_i = 0.50` local) and parity Path A
    # (twin/airpath.py::indicated_power_kw), which needs the NOMINAL value —
    # no known fault perturbs combustion efficiency directly (injector
    # fouling and misfire act on fuel_delivered and T_ind_i, which already
    # flow through measured fuel_flow_kgps), so using one shared constant for
    # both is not degenerate the way sharing eta_c/eta_v would be.
    eta_i_nominal: 0.50

  thermal:
    head_mass_kg: 3.2                     # per cylinder, lumped
    head_cp_J_per_kgK: 900.0              # aluminium
    fin_area_m2: 0.28                     # A_fin
    hA_scale_nominal: 1.0                 # (hA)_sc — UKF state; cooling degradation
    coolant_temp_K: 363.15
    # provenance: calibrated. Lumped head-to-coolant heat transfer coefficient.
    # It lived as a bare `h_air = 50.0` in mvem.py while every other term of the
    # same equation was declared here, and at that value h*A_fin was 14 W/K
    # against ~6.3 kW/cyl of head heat — an equilibrium of ~539 degC. The head
    # is initialised at 140 degC so a short run looked correct and then drifted
    # past the 205 degC limit in under a minute (tau = m*cp/hA = 3.4 min).
    # Calibrated so healthy cruise settles at ~140 degC: hA = Q_gas/(T-T_cool)
    # = 6282/(140-90) = 126 W/K, over A_fin = 0.28 m^2.
    head_htc_W_per_m2K: 450.0

  injector:
    discharge_coeff_nominal: 1.0          # C_d,inj per cylinder — UKF state (x4)
    n_injectors: 4

  oil:
    # provenance: calibrated. oil_press_bar/oil_temp_C were hardcoded
    # constants (3.42 bar, 96.3 degC) — rho10 was therefore pure sensor
    # noise, and f_fric (bearing wear) had no channel to appear on at all.
    # PRAMANA-DIRECTIVE-2026-09-10.md §1.6: gear pump flow, a viscosity-vs-
    # temperature term, laminar flow through the bearing clearances (which
    # widen under wear), a relief valve cap, and a lumped thermal node.
    # Wear is modelled as an effective clearance widening with f_fric_scale
    # (the same UKF parameter that already drives friction torque) — because
    # Q/clearance^4-type laminar flow, a modest clearance increase produces a
    # large, unambiguous pressure drop, which is the real physical signature
    # this residual is supposed to carry.
    # Constants calibrated so nominal steady-state lands near the previous
    # hardcoded values (3.42 bar / 96.3 degC) rather than shifting every
    # existing threshold in the app.
    pump_eta_vol: 0.85
    pump_displacement_m3_per_rev: 5.0e-6
    dp_gain_bar_per_unit: 13700             # k_dp — lumps 128*mu_ref*L/(pi*d_ref^4)
    visc_ref_temp_K: 369.45                # ~96.3 degC — viscosity=1x here
    visc_temp_exponent: 1.6                # oil thins as it heats up
    relief_valve_bar: 7.0                  # matches limits.oil_pressure_bar.max_cold_start
    thermal_mass_kJ_per_K: 4.5             # m_oil * c_oil, lumped
    cooler_gain_W_per_K: 1330.0            # heat rejected to the coolant/cooler per K above coolant temp

# ---------------------------------------------------------------------------
# PROPELLER — the only route to shaft power without a torque sensor.
# A propeller is a calibrated dynamometer: P = C_P(J) * rho * n^3 * D^5
# ---------------------------------------------------------------------------
propeller:
  # provenance: calibrated. prop_cp_map.csv never existed. Replaced with a
  # two-parameter fixed-pitch Cp(J) curve — PRAMANA-DIRECTIVE-2026-09-10.md
  # §1.5. FIXED-PITCH chosen over constant-speed: this VRDE profile has no
  # governor/pitch-actuator model, and a MALE UAV airframe could plausibly
  # carry either — stating the choice explicitly per the directive's
  # instruction, not leaving it ambiguous.
  #   Cp(J) = cp0 * max(1 - (J/J_max)^2, 0)      J = V_TAS / (n * D)
  #   P_prop = Cp(J) * rho_air(h) * n^3 * D^5
  # cp0/J_max are proposed, not sourced from a published prop curve for this
  # specific airframe — sized so P_prop lands near the rated design point at
  # rated_speed_rpm and the assumed cruise TAS below. This is what makes
  # rho5 (= P_indicated - P_prop) a genuine second, independent estimate of
  # shaft power instead of a made-up quadratic with no physical content.
  provenance: assumed
  diameter_m: 1.65               # D
  blades: 3
  cp0: 0.075                     # power coefficient at zero advance ratio
  j_max: 1.05                    # advance ratio at zero net power (feathered/windmill point)
  assumed_tas_mps: 61.2           # matches main.py's current fixed slow.tas_mps
  gear_ratio: 1.0                # direct drive

# ---------------------------------------------------------------------------
# PARITY PATH AVAILABILITY — which of the four air-mass-flow estimates this
# installation can actually produce. The framework degrades gracefully:
# with n paths you get n-1 independent residuals, and the isolability analysis
# is recomputed for whichever sensor set the engine carries.
# ---------------------------------------------------------------------------
parity_paths:
  speed_density: true            # Path 1 — MAP, IAT, crank speed
  compressor_map: true           # Path 2 — turbo speed, pressure ratio
  fuel_lambda: true              # Path 3 — injector command, UEGO
  intake_restriction: false      # Path 4 — UNAVAILABLE: a FADEC aero-diesel is
                                 # unthrottled. Requires a hot-film MAF or venturi.
                                 # State this honestly rather than faking rho_3.
  independent_residuals: 2       # n-1, with n=3 available paths

# ---------------------------------------------------------------------------
# ENVIRONMENT PRESETS — DRDO's own trial numbers, used as scenario definitions
# ---------------------------------------------------------------------------
environment_presets:
  sea_level_isa:
    altitude_ft: 0
    isa_offset_K: 0
  cruise_18k:
    altitude_ft: 18000
    isa_offset_K: 0
    note: "nominal demo cruise point"
  leh_hot_high:
    altitude_ft: 17664           # published: Changla trial ceiling
    isa_offset_K: 20             # ISA+20
    note: "DRDO Leh / Changla high-altitude trial condition"
  ceiling_28k:
    altitude_ft: 28000
    isa_offset_K: 0
    note: "TAPAS BH-201 demonstrated ceiling; far above critical altitude"
