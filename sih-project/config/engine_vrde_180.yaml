# PRAMANA — engine profile: VRDE 180 hp aero-diesel (PRIMARY)
#
# DRDO / Vehicles Research and Development Establishment powerplant for UAVs.
# Chosen as primary because twinning DRDO's own engine, in front of DRDO,
# using their own published altitude-trial numbers as environment presets,
# is the cheapest credibility available to this project.
#
# PROVENANCE MARKERS on every block:
#   published  — quoted from DRDO / open sources, citable in the pitch
#   derived    — computed from published figures
#   assumed    — engineering estimate; MUST be labelled as such if quoted on a slide
#
# A second engine is a config file, not a rewrite. See engine_rotax_914.yaml.

profile:
  id: vrde_180
  name: "VRDE 180 hp Aero-Diesel"
  developer: "Vehicles Research and Development Establishment, DRDO"
  cycle: diesel            # compression ignition
  aspiration: turbocharged
  control: fadec           # indigenously developed FADEC
  provenance: published
  notes: >
    Holds 180 hp constant to 11 000 ft. 1100+ hours accumulated on test
    profiles. High-altitude trials at Leh and Changla to 17 664 ft.
    TAPAS BH-201 production spec calls for two engines at 220 hp each
    (against 100 hp prototype units).

# ---------------------------------------------------------------------------
# GEOMETRY — drives the mean-value model state equations (§4 of the design doc)
# ---------------------------------------------------------------------------
geometry:
  cylinders: 4
  layout: inline
  # Per-field provenance — docs/research/VRDE-PUBLIC-DOSSIER.md §1-2.
  # DRDO/Jayem publish "2.2 L inline-4". The specific base block (Mahindra
  # mHawk 2.2, 2179 cc) is a community claim, adopted deliberately and labelled,
  # because it is the only public source that pins "2.2 L" to a real swept
  # volume. Replaces 2.0 L / 86x86 mm / CR 17.5, which were sized to hit 180 hp
  # and matched nothing published.
  provenance: unverified_community
  displacement_m3: 2.179e-3  # V_d — unverified_community (mHawk 2.2, 2179 cc)
  bore_m: 0.085              # assumed — 85 x 96 mm reproduces 2179 cc exactly; not found in a public source
  stroke_m: 0.096            # assumed — see bore_m
  compression_ratio: 15.5    # published for the AUTOMOTIVE mHawk; the aero build's CR is not public
  connecting_rod_m: 0.150    # assumed; not used by the mean-value model
  strokes_per_cycle: 4       # the 120 in the speed-density relation is 2 rev x 60 s
  gear_ratio: 1.69           # keep in sync with propeller.gear_ratio — see that block

# ---------------------------------------------------------------------------
# RATINGS
# ---------------------------------------------------------------------------
ratings:
  provenance: published
  rated_power_kW: 134.2          # 180 hp
  rated_power_hp: 180
  critical_altitude_ft: 11000    # above this the turbo cannot hold rated MAP
  critical_altitude_m: 3352.8
  # Crank speeds: VRDE publishes none. Taken from the same-class engine the
  # VRDE unit replaces on TAPAS (Austro E4P, EASA TCDS E.200), labelled so.
  # Through the 1.69 gearbox these give the certificated prop speeds below,
  # which is what keeps the propeller tip subsonic — the previous 3800 rpm
  # direct drive on a 1.65 m propeller put the tip at ~328 m/s, supersonic.
  rated_speed_rpm: 3880          # published_comparable_engine — E4P take-off
  max_continuous_rpm: 3720       # published_comparable_engine — E4P max continuous
  idle_rpm: 900                  # assumed
  takeoff_prop_rpm: 2300         # published_comparable_engine
  max_continuous_prop_rpm: 2200  # published_comparable_engine

# ---------------------------------------------------------------------------
# PUBLISHED VALIDATION ANCHORS — deliberately separate from model parameters.
#
# These are observations from VRDE's public product page, not values inferred
# from the model.  `backend/validate_vrde.py` evaluates them and reports the
# discrepancy without silently changing an assumed sub-model to make a gate
# pass.  DRDO does not publish a dynamometer curve or power at 17,664 ft, so
# the high-altitude record is an operating-validation point only, not a made-up
# power target.
# Source (accessed 2026-09-12):
# https://drdo.gov.in/drdo/en/offerings/products/180-hp-diesel-engine-uav
# ---------------------------------------------------------------------------
validation_anchors:
  provenance: published
  source: "DRDO — 180 Hp Diesel Engine for UAV"
  power_hold:
    target_hp: 180.0
    altitude_ft: [0, 11000]
    note: "DRDO: take-off power is constant up to 11,000 ft."
  high_altitude_trial:
    altitude_ft: 17664
    note: "DRDO: tested and validated for high-altitude performance at Leh and Changla."
    published_power_hp: null      # not published; do not infer one
  # -------------------------------------------------------------------------
  # VRDE's OWN programme requirement — 2015 Expression of Interest for joint
  # development of a 200 hp aero-diesel (VRDE Ahmednagar). A REQUIREMENT, not
  # a measurement, and for a 200 hp programme whereas the delivered product is
  # rated 180 hp. So it is used two ways, never conflated:
  #   - absolute bands: reported, labelled "200 hp programme requirement";
  #   - LAPSE bands (power / sea-level power): the primary altitude-form check,
  #     because the altitude-response a DRDO lab specified carries over to the
  #     180 hp product even though the absolute rating changed.
  # Full citation trail: docs/research/VRDE-PUBLIC-DOSSIER.md §1.1.
  # -------------------------------------------------------------------------
  vrde_eoi_2015:
    provenance: published
    kind: requirement
    source: "VRDE Ahmednagar EOI (2015), 200 hp aero-diesel joint development"
    url: "http://indias-defence.blogspot.com/2015/05/vrde-developing-aero-diesel-engine-for.html"
    power_bands_hp:
      - {altitude_ft: 0,     min: 195.0, max: 205.0}
      - {altitude_ft: 10000, min: 195.0, max: 205.0}
      - {altitude_ft: 20000, min: 145.0, max: 155.0}
      - {altitude_ft: 30000, min: 105.0, max: 115.0}
    sfc_g_per_kWh_msl: 210.0
    installed_weight_kg: 250.0
    note: "Requirement for a 200 hp programme; compare LAPSE, not absolute hp, against the 180 hp product."

  # -------------------------------------------------------------------------
  # The engine the VRDE unit replaces on TAPAS: Austro E4P (AE330). Same class
  # (automotive-derived 2 L common-rail turbo-diesel, liquid-cooled, integrated
  # gearbox, dual-channel EECU). Type-certificated, so its numbers are primary
  # sources — for a DIFFERENT engine. Model-form and limit reference only.
  # Dossier §3.
  # -------------------------------------------------------------------------
  comparable_engine_austro_e4p:
    provenance: published_comparable_engine
    name: "Austro Engine E4P (AE330)"
    source: "EASA TCDS E.200 Issue 12 (2020); Austro E4 Series factsheet 05/2024"
    url: "https://www.easa.europa.eu/en/downloads/7617/en"
    displacement_cm3: 1991
    gearbox_ratio: 1.69
    takeoff_power_kW: 132.0
    takeoff_crank_rpm: 3880
    takeoff_prop_rpm: 2300
    max_continuous_power_kW: 126.0
    max_continuous_crank_rpm: 3720
    fuel_flow_L_per_h:
      - {power_frac: 1.00, L_per_h: 39.0}
      - {power_frac: 0.60, L_per_h: 21.0}
    # Same value as config/sensors.yaml fuel_flow_kgps.fuel_density_kg_per_l
    # (published, 15 degC) so the project carries one fuel density, not two.
    # Used only to convert the published L/h to kg/h.
    fuel_density_kg_per_L: 0.82
    fuel_density_provenance: published
    note: "Never present these as VRDE measurements."

  comparable_engine_surrogate:
    # SECONDARY comparable (superseded as the altitude target by vrde_eoi_2015).
    # This is NOT VRDE data.  It is a public, close-architecture benchmark for
    # checking whether the model's altitude lapse and fuel economy are of the
    # right order before VRDE dynamometer data becomes available.
    provenance: published_comparable_engine
    name: "TEI PD180ST"
    source: "TEI — PD180ST Turbodiesel Aviation Engine"
    architecture: "2.1 L inline-4, common-rail, single-stage turbo, FADEC"
    max_power_hp: 182.0
    max_continuous_power_hp: 172.0
    bsfc_g_per_kWh_msl: 220.0
    altitude_power_hp:
      - {altitude_ft: 20000, power_hp: 170.0}
      - {altitude_ft: 30000, power_hp: 115.0}
      - {altitude_ft: 40000, power_hp: 75.0}
    note: "Never present these as VRDE measurements."

# ---------------------------------------------------------------------------
# LIMITS — these are the redlines the twin is beating. Fixed-threshold systems
# alarm here; PRAMANA alarms on residual departure well before.
# ---------------------------------------------------------------------------
limits:
  provenance: assumed            # no public TCDS for this engine; see Rotax profile
  cht_C: 200.0                   # cylinder head temperature
  coolant_C: 105.0               # published_comparable_engine — TCDS E.200, E4 max coolant
  oil_temp_C: 130.0
  gearbox_oil_C: 120.0           # published_comparable_engine — TCDS E.200 max gearbox temperature
  oil_pressure_bar:
    min_above_2500rpm: 2.0
    min_below_2500rpm: 0.8
    max_cold_start: 7.0
  manifold_pressure_hPa:
    takeoff: 2200
    max_continuous: 1900
  egt_C: null                    # deliberately null — EGT is a TREND parameter here,
                                 # not a limit parameter. This is the argument for a twin.

# ---------------------------------------------------------------------------
# FUEL
# ---------------------------------------------------------------------------
fuel:
  type: jet_a1                   # aero-diesel runs heavy fuel
  Q_LHV_J_per_kg: 43.0e+6        # lower heating value
  AFR_stoich: 14.5               # ~14.5-14.7 by mass for both diesel and
                                  # gasoline — chemically similar, this figure
                                  # was already correct and needs no fix
  provenance: published

  # ---------------------------------------------------------------------------
  # FUEL-LED SCHEDULE — a real compression-ignition diesel, not spark-ignition
  # ---------------------------------------------------------------------------
  # provenance: assumed (the constants), published (the architecture — every
  # source consulted on aero-diesel/common-rail control agrees the load path
  # is fuel-led: power-lever position -> commanded injection quantity ->
  # torque, with boost a CONSEQUENCE of exhaust enthalpy, not the control
  # input). This replaced a load path that commanded a TARGET LAMBDA from
  # throttle position and derived fuel FROM measured air mass — spark-ignition
  # logic (the mixture strategy a stoichiometric petrol engine actually uses),
  # physically impossible for a diesel: compression ignition has no
  # stoichiometric setpoint to hold, runs unthrottled and always lean, and
  # sizes fuel to the injector, not to a target air-fuel ratio.
  #
  # rated_fuel_flow_kgps sizes the top of the schedule so 100% throttle,
  # unconstrained by boost, delivers close to the rated 134.2 kW:
  #     mdot_f = P_rated / (eta_i * Q_LHV) = 134200 / (0.50 * 43.0e6)
  #            = 0.006242 kg/s
  # This is the fuel needed for RATED INDICATED power; actual brake power lands
  # a little below it once friction is subtracted, which is the correct
  # physical relationship (T_ind - T_fric = T_brake), not an error to correct
  # away.
  rated_fuel_flow_kgps: 0.006242

  # Idle fuel as a fraction of rated. Diesels idle very lean (research: idle
  # lambda commonly 4-6+) because unlike a throttled SI engine they are not
  # air-limited at idle — the FADEC simply meters little fuel. ~10-15% of
  # rated flow is a typical order-of-magnitude figure for a common-rail
  # diesel at idle; no published VRDE idle-fuel figure exists, so this is an
  # engineering estimate in the middle of that range, in the same spirit as
  # every other "assumed" constant in this file.
  idle_fuel_frac: 0.12

  # SMOKE LIMITER — a ceiling on commanded fuel, not the control input. This
  # is how a diesel's air path actually constrains load: injecting more fuel
  # than the available air can burn cleanly produces visible smoke and
  # unacceptable particulate/soot, so the FADEC caps injection quantity to
  # keep the in-cylinder mixture at or leaner than this ratio. Sourced from
  # the same research establishing this engine's identity: real aero-diesels
  # run roughly lambda 1.15-1.3 (AFR ~17-20) at full power, which in practice
  # IS the smoke limit being enforced. 1.15 is the LEAN (safe) end of that
  # range — a conservative ceiling, so the twin does not present a smokier
  # exhaust than a real FADEC would ever command.
  #
  # This is what makes boost a CEILING on power, not a target: above the
  # critical altitude, less boost means a tighter smoke limit means less fuel
  # is ALLOWED regardless of what the throttle schedule asks for — the correct
  # mechanism behind "flat power to 11,000 ft, then falls", now enforced at
  # the fuel-metering point instead of only via the wastegate's boost target.
  lambda_smoke_limit: 1.15

# ---------------------------------------------------------------------------
# MVEM PARAMETERS — the health parameters theta live here as nominal values.
# The UKF estimates SCALE FACTORS on these; the scale factors ARE the health
# indicators reported to the operator, in physical units.
# ---------------------------------------------------------------------------
mvem:
  intake_manifold_volume_m3: 4.0e-3      # V_im, filling-and-emptying
  R_air_J_per_kgK: 287.05
  gamma_air: 1.40
  cp_air_J_per_kgK: 1005.0
  cp_exhaust_J_per_kgK: 1150.0

  volumetric_efficiency:                  # eta_v(p_im, N) — ring wear and valve
    # provenance: calibrated. lookup_eta_v.csv was referenced but never
    # existed; replaced with a named speed-density correlation instead of a
    # constant, per PRAMANA-DIRECTIVE-2026-09-10.md §1.4. eta_v_scale (UKF
    # state) multiplies this correlation's output — ring wear enters here.
    #   eta_v = c0 + c1*sqrt(p_im_bar) + c2*N_krpm + c3*N_krpm^2
    # Fit so eta_v lands in 0.80-0.95 across the operating envelope; verified
    # numerically by backend/gates_check.py, not eyeballed.
    correlation_c0: 0.80
    correlation_c1: 0.04
    correlation_c2: 0.003
    correlation_c3: -0.0002
    scale_nominal: 1.0                    # eta_v_sc — UKF state

  compressor:
    # -----------------------------------------------------------------------
    # FLOW-CAPACITY LOSS RATIO — the gas-path-analysis "fault ratio" R
    # -----------------------------------------------------------------------
    # provenance: published (value), assumed (its application to this engine).
    #
    # Standard gas-path analysis represents degradation as TWO multiplicative
    # health parameters, not one: a flow factor SW = q/q_ref (q = W*sqrt(T)/p,
    # corrected mass flow) and an efficiency factor SE = eta/eta_ref. The ratio
    #     R = delta(SW) / delta(SE)
    # is the accepted SIGNATURE of a fault type. Mathioudakis, Alexiou,
    # Aretakis & Romesis, "Signatures of Compressor and Turbine Faults in Gas
    # Turbine Performance Diagnostics: A Review", Energies 2024, 17, 3409
    # (doi:10.3390/en17143409) compiles the published pairs.
    #
    # Published R by mechanism:
    #   fouling        R ~ 2-3   (full range 0.8-3.5; Zwebek & Pilidis 2003
    #                             use the clean convention -1% SW / -0.5% SE)
    #   tip clearance  R ~ 1     (flow falls roughly proportionally)
    #   erosion        R >= 8    (flow-capacity dominant)
    #
    # We use R = 1.0, deliberately at the BOTTOM of the range, for three
    # reasons:
    #   1. The closest direct analogue is a turbocharger on a diesel engine —
    #      Chen et al., "A performance degradation evaluation method for a
    #      turbocharger in a diesel engine" — which defines the same two
    #      indices and implants -2% flow / -2% efficiency, i.e. R = 1.
    #   2. The R ~ 2-3 fouling figures come largely from LONG AXIAL stacks,
    #      where the review's stage-stacking analysis shows an intrinsic R = 1
    #      fault in the FIRST stage presents as R = 2.4 for the whole machine.
    #      A turbocharger is a single radial stage, so that amplification does
    #      not apply.
    #   3. It is the conservative choice: it produces the SMALLEST flow loss
    #      and therefore the smallest rho1 response, so the detection claim
    #      holds across the whole published range rather than depending on
    #      picking a favourable number.
    #
    # WHY THIS EXISTS AT ALL: eta_c_scale alone was an incomplete degradation
    # model. The Ellipse flow map depends on shaft speed and pressure ratio,
    # NOT on efficiency, so an efficiency-only fault is invisible to parity
    # Path 2 — measured at 0.4 sigma of rho1 response, with the WRONG SIGN.
    # The incidence matrix has always predicted rho1 = -2 for turbo
    # degradation, so the physics-derived signature table was right and the
    # simulator was wrong.
    #
    # MEASURED SENSITIVITY at R = 1.0 (rho1, sigma1 = 0.01054), which is the
    # honest figure to quote rather than the 25% fault the gates inject:
    #     1% efficiency loss -> 1.2 sigma   (not detected)
    #     2%                 -> 1.8 sigma   (not detected)
    #     3%                 -> 2.9 sigma   (marginal)
    #     5%                 -> 4.9 sigma   (detected)
    #    10%                 -> 10.4 sigma  (detected)
    # So rho1 catches fouling from roughly 3-5% efficiency loss upward. It does
    # not catch the first 1-2%. At R = 2 the threshold drops to about 2%.
    # Sensitivity band to quote if asked: R in [1, 3].
    flow_capacity_loss_ratio: 1.0

    # provenance: calibrated. compressor_map.csv was referenced but never
    # existed. Replaced with Leufven & Eriksson's Ellipse model (Control
    # Engineering Practice 21 (2013) 1871-1883) — parameterises the whole map
    # in dimensionless head/flow with ~6 constants, no lookup table needed.
    # Validated by the authors against 236 real compressor maps to <2.5%
    # mean error in the normal operating region.
    #
    # These SIX constants are proposed, not sourced from a real VRDE map (one
    # was never published) — they are sized for a small turbocharger serving
    # a ~2 L four-cylinder making ~134 kW, and calibrated so the model
    # reproduces plausible turbocharged-aero-engine boost behaviour (see the
    # gates in PRAMANA-DIRECTIVE-2026-09-10.md §1.7). If a real map ever
    # becomes available, replace these six numbers only — the equations do
    # not change.
    #
    # provenance: scaled (2026-09-19). impeller_diameter_m was 0.070 (70 mm) —
    # a reference-machine error, not a fitting problem. Physical check: a
    # 70 mm wheel at the 172,000 rpm published clamp (E4/TCDS E.200, see
    # max_shaft_rpm below) gives blade tip speed pi*D*N/60 = 630 m/s, well
    # past the ~450-500 m/s ceiling aluminum compressor wheels are designed
    # to (higher fails on the test stand). Sourced replacement: Garrett
    # GT1749V, fitted to ~140-180 hp 2.0 L automotive diesels (VW/Audi TDI,
    # Rover 2.0 diesel) — same power/displacement bracket as VRDE's
    # mHawk-derived 2.2 L block. Multiple independent aftermarket
    # compressor-wheel listings confirm ~49 mm exducer OD (range 49-52 mm
    # across trims). At 49 mm / 172,000 rpm, tip speed = 449 m/s — inside
    # the normal ceiling, i.e. physically sane where 70 mm was not. This is
    # a geometry/containment check only, not a full map match — the
    # GT1749V's flow-vs-pressure-ratio map has not been verified to cover
    # VRDE's required mass flow and boost at rated power; Phase 6's fit
    # residual (or held-out validation) is what would catch a mismatch
    # there.
    #
    # psi_max_design/phi_max_design are dimensionless blade-family shape
    # coefficients, not size-dependent — a same-family diameter change does
    # not move them. Deliberately held fixed rather than handed to Phase
    # 6's optimizer alongside the fuel-side fit: letting all three
    # compressor constants float in the same fit as the fuel/BSFC params
    # risks the discrepancy (a Kennedy-O'Hagan calibration failure mode)
    # getting absorbed into the wrong parameter — a fuel-side mismatch
    # "fixed" by quietly distorting the compressor shape instead, which
    # looks like a good fit while hiding a wrong model.
    #
    # n_corr_design_rpm: DERIVED, not fitted or left unchanged. Turbo
    # similarity (same physics behind the +-20% scaling-law validity band)
    # says rotational speed scales inversely with diameter to preserve
    # blade tip speed/Mach number: N ~ 1/D. Scaling the old design point
    # (118,000 rpm @ 70 mm) to the new 49 mm wheel:
    #     118,000 * (70 / 49) = 168,571 rpm  ->  168,600
    # This lands within 2% of BOTH the sourced containment ceiling
    # (172,000 rpm, E4/TCDS E.200) and the GT1749V's own rated max
    # (175,000 rpm) — independent confirmation the geometry fix is
    # coherent end to end, not just a tip-speed coincidence.
    impeller_diameter_m: 0.049            # D_c — Garrett GT1749V exducer OD (49mm, ~140-180hp automotive diesel class)
    psi_max_design: 1.8                   # dimensionless head ceiling at design speed — held fixed, same blade family
    phi_max_design: 0.095                 # dimensionless flow ceiling at design speed — held fixed, same blade family
    n_corr_design_rpm: 168600             # reference corrected speed — derived via N~1/D turbo similarity from 118000 rpm @ 70mm
    c_psi: 2.0                            # ellipse exponent, head
    c_phi: 2.0                            # ellipse exponent, flow
    psi_speed_exponent: 0.5               # how psi_max grows with corrected speed
    phi_speed_exponent: 1.0               # how phi_max grows with corrected speed
    efficiency_nominal: 0.72              # eta_c_max — peak, at the design point
    scale_nominal: 1.0                    # eta_c_sc — UKF state
    inertia_kgm2: 2.0e-5                  # J_tc
    mech_efficiency: 0.98                 # eta_m
    # provenance: fixed by source (2026-09-19), not fitted. Mechanical
    # overspeed limit — bearing/blade stress ceiling every real turbo has.
    # Without one, N_corr rising with altitude (T01 falling at fixed physical
    # rpm) lets the Ellipse model's capacity grow without bound, and
    # "critical altitude" stops being a real physical limit.
    #
    # Was 110,000 rpm (calibrated, not sourced) — sized only so it did not
    # bind at the 18,000 ft cruise gate, and it ended up binding at every
    # operating point instead. Replaced with 172,000 rpm: the published
    # comparable containment speed (Austro E4 / TCDS E.200), independently
    # corroborated by the Garrett GT1749V (see impeller_diameter_m above) —
    # a real turbo in this power/displacement class rates its max shaft
    # speed at 175,000 rpm, essentially the same number from an unrelated
    # source. This is a KNOWN CONSTANT, fixed here rather than left for the
    # optimizer to touch.
    #
    # This does NOT by itself reproduce the published 11,000 ft critical
    # altitude — at 172,000 rpm the clamp stops binding entirely (measured:
    # MAP holds 2.20 bar to 16,000 ft, power flat at 166 hp to 20,000 ft).
    # That gap is now closed on the sourced impeller_diameter_m (49 mm, was
    # 70 mm) instead of on this clamp: a smaller wheel cuts flow area by
    # (49/70)^2 ~ 0.49, which is the mechanism that should pull critical
    # altitude down toward 11,000 ft. psi_max_design/phi_max_design/
    # n_corr_design_rpm still need Phase 6 (backend/calibrate.py) to
    # re-derive against the new diameter — recorded in
    # docs/VALIDATION-STATUS.md.
    max_shaft_rpm: 172000

  turbine:
    # provenance: calibrated. The turbine's expansion ratio was previously
    # computed from p_im/p_atm — the INTAKE side's pressure ratio, not the
    # exhaust side's. That coupling is what created the absorbing state
    # (PRAMANA-DIRECTIVE-2026-09-10.md §1.3): when p_im fell below p_atm,
    # the same clamp zeroed both P_comp AND P_turb, so the turbo could never
    # respool. A running engine always has exhaust manifold pressure above
    # ambient — the turbine has expansion available independent of what the
    # intake side is doing. Modelled as a simple flow-driven backpressure
    # (nozzle-like), CHOKING at pressure_ratio_max rather than growing
    # unboundedly — real turbine nozzles saturate.
    #   Pi_t = min(1 + gain*(mdot_ex/mdot_ex_design)^2, pressure_ratio_max)
    #
    # mdot_ex_design_kgps was originally sized for full-power sea-level
    # exhaust flow (~0.14 kg/s), then recalibrated to the OLD 18,000 ft
    # demo cruise point (~0.030 kg/s). Re-recalibrated 2026-09-19 to the
    # corrected 11,000 ft/72% reference point (see gates_check.py's module
    # docstring for why 18,000 ft was replaced) — that altitude's denser
    # air gives a much higher actual exhaust flow, 0.0761 kg/s, measured
    # directly from a fixed-point iteration (mdot_ex_design set to the
    # previous iteration's measured flow, repeated to convergence — the
    # simulation itself feeds back into what "the operating point" measures,
    # since higher design flow changes Pi_t which changes turbo speed which
    # changes air/exhaust flow). Converged immediately: the compressor fit
    # (calibrate_compressor.py, unchanged from baseline against this same
    # corrected target) and this turbine value are now mutually consistent.
    # A real turbo's nozzle area is sized for where the engine actually
    # spends its time — cruise, not the rare full-power sea-level case —
    # so mdot_ex_design is calibrated to that operating point instead, with
    # the choke cap doing the job of preventing runaway Pi_t at full power
    # that an uncapped model would otherwise need a compromise design point
    # to avoid.
    efficiency_nominal: 0.70              # eta_t
    pressure_ratio_gain: 1.1              # backpressure build-up with exhaust flow
    mdot_ex_design_kgps: 0.0761           # calibrated to 11kft/72% cruise exhaust flow
    pressure_ratio_max: 3.2               # choke limit — typical for a small single-stage turbine

  wastegate:
    # FADEC closed-loop boost control. provenance: assumed.
    # This was a hardcoded proportional-only gain (`_wastegate_gain = 14.0` in
    # mvem.py). Proportional-only control cannot reach its own target: measured
    # after the 2179 cc change, MAP sat +33 to +48 mbar ABOVE the FADEC's MAP
    # target at every point checked (0-18,000 ft, 60-72 %), which also pushed
    # Gate 1 0.46 mbar over its 1.4 bar ceiling. A real FADEC boost loop carries
    # integral action for exactly this reason. Integral time 2 s: slower than
    # turbo spool so the loop does not fight turbo lag, fast against the
    # mission's altitude and throttle changes. The proportional gain is the
    # previously calibrated value, unchanged.
    proportional_gain_per_bar: 14.0
    integral_time_s: 2.0

  crankshaft:
    inertia_kgm2: 0.35                    # J
    friction_coeff_nominal: 1.0           # f_fric — UKF state; bearing wear channel

  gearbox:
    # Integrated propeller reduction gearbox — published for VRDE; its ratio is
    # not, see geometry.gear_ratio. provenance: assumed. A single-stage
    # spur/helical reduction runs 97-98 % efficient; mid-range value.
    efficiency: 0.975
    # Gearbox oil thermal node. provenance: assumed. Heat in is the gearbox
    # loss, (1/efficiency - 1) * propeller power; heat out goes to engine
    # coolant through the gearbox oil line (the E4P took its power increase
    # partly by adding cooling in exactly that line). Sized as a heat exchanger
    # so sea-level take-off settles ~15 K under the 120 degC comparable limit:
    #   Q = (1/0.975 - 1) * 130.8 kW = 3.35 kW;  T_gb - T_cool = 105 - 90 = 15 K
    #   UA = 3350 / 15 = 224 W/K.  tau = 6000 / 224 = 27 s.
    oil_thermal_mass_kJ_per_K: 6.0
    oil_to_coolant_UA_W_per_K: 224.0

  combustion:
    # provenance: calibrated. 0.40 is the low end for a modern FADEC-
    # controlled common-rail turbodiesel — 0.42-0.48 indicated thermal
    # efficiency is a realistic, citable range for this engine class.
    # Single source of truth for BOTH the plant (mvem.py, which used to
    # hardcode this as a bare `eta_i = 0.50` local) and parity Path A
    # (twin/airpath.py::indicated_power_kw), which needs the NOMINAL value —
    # no known fault perturbs combustion efficiency directly (injector
    # fouling and misfire act on fuel_delivered and T_ind_i, which already
    # flow through measured fuel_flow_kgps), so using one shared constant for
    # both is not degenerate the way sharing eta_c/eta_v would be.
    eta_i_nominal: 0.50

  cooling:
    # LIQUID COOLING LOOP. The engine is an automotive-derived liquid-cooled
    # diesel (dossier §1: the mHawk base and every same-class aero-diesel are
    # liquid-cooled), but the twin modelled a FIXED coolant temperature and
    # air-cooled fin area — so coolant temperature could never rise, a blocked
    # radiator was unmodellable, and the only cooling fault was an abstract
    # conductance scale. This block replaces that with a real loop.
    #
    #   dT_cool/dt * C = sum_i UA_head (T_cht_i - T_cool)     head rejection
    #                  + oil-cooler heat + gearbox-oil heat   other loads
    #                  - x_thermostat * eff_rad * mdot_ram * cp * (T_cool - T_amb)
    #
    # A profile WITHOUT this block (engine_rotax_914.yaml, a hybrid air/liquid
    # engine) keeps the previous fixed-coolant air-path model unchanged.
    type: liquid
    provenance: derived              # from the engine's class; VRDE publishes no cooling data
    # Lumped coolant + block/head metal heat capacity. assumed: ~4 L of 50/50
    # glycol (~3.5 kJ/kgK) plus the metal it is in contact with. tau at the
    # sized radiator UA is ~45 s, the right order for a warm-up transient.
    coolant_thermal_mass_kJ_per_K: 30.0
    # Head-to-coolant conductance. Numerically IDENTICAL to the old
    # head_htc_W_per_m2K * fin_area_m2 = 450 * 0.28 = 126 W/K, so cylinder-head
    # temperature behaviour is continuous across this change; only the sink
    # temperature becomes a state instead of a constant.
    head_to_coolant_UA_W_per_K: 126.0
    # Conductance follows coolant flow as Re^0.8 (Dittus-Boelter,
    # Nu = 0.023 Re^0.8 Pr^n — published correlation form), with flow taken
    # proportional to crank speed because the pump is belt/gear driven. This is
    # what makes a degraded coolant pump a physically distinct fault from a
    # blocked radiator.
    coolant_flow_exponent: 0.8
    thermostat:
      # published_comparable_engine — AE300/AE330 maintenance manual stages:
      # small circuit below 80 degC, mixed 80-95, full radiator flow above 95.
      open_C: 80.0
      full_open_C: 95.0
    radiator:
      # Ram-air core. mdot_ram = rho_amb * TAS * frontal_area * capture_fraction.
      # frontal_area is SIZED (not fitted to a test) for the worst cooling case
      # a real installation is sized for: HOT-DAY take-off at low airspeed.
      # First pass used the ISA-standard day (15 degC) and gave 0.067 m^2 —
      # which then ran the coolant over the 105 degC limit at ISA+20.
      # Aircraft cooling is sized for the hot day, so it was re-sized against
      # that case. Third column re-measured 2026-09-19 at the corrected
      # 11,000 ft reference altitude (was 18,000 ft — see gates_check.py's
      # module docstring) and against the post-compressor/turbine-fit model;
      # the SL columns shifted too (boost/intake-temp changes reach the
      # coolant loop even at sea level), confirmed by re-running the whole
      # sweep rather than assuming SL was unaffected. Sizing decision
      # (0.086) is unchanged — margin actually improved. Measured across a
      # sweep (backend, 500 s to steady state, 100 % throttle, 40 m/s):
      #   A_rad    SL ISA    SL ISA+20    11,000 ft cruise
      #   0.067    93.9      107.5 (over)  92.3
      #   0.078    92.2       97.3         90.7
      #   0.086    91.2       94.3         89.8     <- chosen, 10.7 K margin
      #   0.095    90.3       93.2         89.0
      # At the sizing point the thermostat is fully open, which is what "sized
      # for the worst case" means — and it is why radiator fouling shows up as
      # rising coolant temperature rather than being absorbed by the valve.
      # At altitude the core is far oversized and the thermostat closes to hold
      # the coolant in its band instead.
      frontal_area_m2: 0.086
      capture_fraction: 0.35         # assumed — duct/ram recovery through the cowl
      effectiveness: 0.60            # assumed — compact air-to-air core
    intercooler:
      # Air-to-air charge-air cooler (the automotive base engine is intercooled;
      # dossier §2). Effectiveness assumed mid-range for a compact air-to-air
      # core. This is the first model in which IAT is genuinely post-intercooler
      # (telemetry-schema.md has always described it that way) and in which
      # comp_out_T_K / comp_out_p_hPa are real values rather than MAP echoes.
      effectiveness: 0.65            # assumed
      dp_hPa_at_rated_flow: 30.0     # assumed — core pressure drop, scales with flow^2

  thermal:
    head_mass_kg: 3.2                     # per cylinder, lumped
    head_cp_J_per_kgK: 900.0              # aluminium
    fin_area_m2: 0.28                     # A_fin
    hA_scale_nominal: 1.0                 # (hA)_sc — UKF state; cooling degradation
    coolant_temp_K: 363.15
    # provenance: calibrated. Lumped head-to-coolant heat transfer coefficient.
    # It lived as a bare `h_air = 50.0` in mvem.py while every other term of the
    # same equation was declared here, and at that value h*A_fin was 14 W/K
    # against ~6.3 kW/cyl of head heat — an equilibrium of ~539 degC. The head
    # is initialised at 140 degC so a short run looked correct and then drifted
    # past the 205 degC limit in under a minute (tau = m*cp/hA = 3.4 min).
    # Calibrated so healthy cruise settles at ~140 degC: hA = Q_gas/(T-T_cool)
    # = 6282/(140-90) = 126 W/K, over A_fin = 0.28 m^2.
    head_htc_W_per_m2K: 450.0

  injector:
    discharge_coeff_nominal: 1.0          # C_d,inj per cylinder — UKF state (x4)
    n_injectors: 4

  oil:
    # provenance: calibrated. oil_press_bar/oil_temp_C were hardcoded
    # constants (3.42 bar, 96.3 degC) — rho10 was therefore pure sensor
    # noise, and f_fric (bearing wear) had no channel to appear on at all.
    # PRAMANA-DIRECTIVE-2026-09-10.md §1.6: gear pump flow, a viscosity-vs-
    # temperature term, laminar flow through the bearing clearances (which
    # widen under wear), a relief valve cap, and a lumped thermal node.
    # Wear is modelled as an effective clearance widening with f_fric_scale
    # (the same UKF parameter that already drives friction torque) — because
    # Q/clearance^4-type laminar flow, a modest clearance increase produces a
    # large, unambiguous pressure drop, which is the real physical signature
    # this residual is supposed to carry.
    # Constants calibrated so nominal steady-state lands near the previous
    # hardcoded values (3.42 bar / 96.3 degC) rather than shifting every
    # existing threshold in the app.
    pump_eta_vol: 0.85
    pump_displacement_m3_per_rev: 5.0e-6
    dp_gain_bar_per_unit: 13700             # k_dp — lumps 128*mu_ref*L/(pi*d_ref^4)
    visc_ref_temp_K: 369.45                # ~96.3 degC — viscosity=1x here
    visc_temp_exponent: 1.6                # oil thins as it heats up
    relief_valve_bar: 7.0                  # matches limits.oil_pressure_bar.max_cold_start
    thermal_mass_kJ_per_K: 4.5             # m_oil * c_oil, lumped
    cooler_gain_W_per_K: 1330.0            # heat rejected to the coolant/cooler per K above coolant temp

# ---------------------------------------------------------------------------
# PROPELLER — the only route to shaft power without a torque sensor.
# A propeller is a calibrated dynamometer: P = C_P(J) * rho * n^3 * D^5
# ---------------------------------------------------------------------------
propeller:
  # CONSTANT-SPEED propeller with a governor. VRDE's own 2015 specification
  # lists a "propeller governor" (docs/research/VRDE-PUBLIC-DOSSIER.md §1), so
  # the previous fixed-pitch model was the wrong machine. The governor moves
  # blade pitch to hold a scheduled prop speed: throttle changes TORQUE while
  # rpm holds, as on the real aircraft.
  type: constant_speed
  provenance: assumed
  diameter_m: 1.90               # assumed — helical tip Mach 0.79 at 2300 rpm and
                                 # 61 m/s TAS at the 32,000 ft ceiling (a = 300.6 m/s)
  blades: 3
  gear_ratio: 1.69               # published_comparable_engine (E4P); keep in sync with geometry.gear_ratio
  inertia_kgm2: 1.2              # assumed — 3-blade composite; reflected to the crank as J / ratio^2

  # POWER COEFFICIENT — single-station blade element at 0.75 R:
  #   phi   = atan(J / (0.75 pi))                    inflow angle
  #   alpha = beta - phi                             section angle of attack
  #   Cl    = cl_alpha * alpha, capped at +/- cl_max
  #   Cd    = cd0 + k_induced * Cl^2
  #   Cp    = k_power * ((0.75 pi)^2 + J^2) * (Cl sin(phi) + Cd cos(phi))
  # Form: McCormick, "Aerodynamics, Aeronautics and Flight Mechanics", 2nd ed.,
  # blade-element theory, evaluated at the representative 0.75 R station with
  # induced velocity neglected. That neglect makes it poor at very low advance
  # ratio (static, J < ~0.3), which the scenario never visits — stated, not
  # hidden. The same function is the plant's load AND parity Path B of rho5
  # (twin/airpath.py::propeller_cp), for the reason the compressor map is shared.
  cp_model: blade_element_075R
  cl_alpha_per_rad: 6.2832       # published — thin-airfoil lift slope, 2 pi per rad
  cl_max: 1.2                    # assumed — pre-stall section limit
  cd0: 0.012                     # assumed — clean section profile drag
  k_induced: 0.02                # assumed — lift-dependent drag factor
  # k_power is SIZED, not fitted to a test. A propeller matched to this engine
  # absorbs rated shaft power at the sea-level take-off design point (2300 prop
  # rpm, 40 m/s -> J = 0.549, phi = 13.1 deg) at a moderate 6 deg angle of
  # attack, i.e. beta = 19.1 deg:
  #   Cp_req = 0.975 * 134.2 kW / (1.225 * 38.33^3 * 1.90^5) = 0.0766
  #   Cl = 0.658, Cd = 0.0207 -> Cl sin(phi) + Cd cos(phi) = 0.1695
  #   k_power = 0.0766 / (5.852 * 0.1695) = 0.0772
  k_power: 0.0772
  beta_fine_stop_deg: 12.0       # assumed — low-pitch stop
  beta_coarse_stop_deg: 45.0     # assumed — high-pitch stop (not a feathering model)

  governor:
    # Prop-speed setpoint from the single power lever, as a FADEC schedules it.
    # provenance: assumed shape between published_comparable_engine end points
    # (2200 max-continuous, 2300 take-off prop rpm). The AE300's actual schedule
    # is in its operation manual, which is not public.
    schedule_throttle_frac: [0.0, 0.50, 0.95, 1.00]
    schedule_prop_rpm:      [1900, 2050, 2200, 2300]
    # PI on fractional prop-speed error, output in degrees of pitch. DERIVED
    # from the linearised speed loop at the take-off design point, not tuned:
    #   dCp/dbeta = 0.717 /rad -> dP/dbeta = 21.4 kW/deg -> 54.0 N m/deg at the crank
    #   J_eff = 0.35 + 1.2 / 1.69^2 = 0.770 kg m^2 -> 70.1 rad/s^2 per deg
    #   load damping 2T/w = 1.63 N m s -> 2.11 /s
    #   s^2 + (2.11 + 0.1725 kp) s + 0.1725 ki = 0;  target wn = 3 rad/s, zeta = 0.8
    #   -> kp = 15.6 deg per unit error, ki = 52.2 deg/s per unit error
    # ~0.5-1 s is the normal response of a hydraulic piston-prop governor.
    kp_deg_per_unit_error: 15.6
    ki_deg_per_s_per_unit_error: 52.2
    pitch_rate_limit_deg_per_s: 15.0   # assumed — hydraulic pitch-change rate

  assumed_tas_mps: 61.2          # DEFAULT only, for call sites with no scenario TAS
                                 # (offline tests, validation). Live frames pass the
                                 # scenario TAS, sensed through config/sensors.yaml tas_mps.

# ---------------------------------------------------------------------------
# PARITY PATH AVAILABILITY — which of the four air-mass-flow estimates this
# installation can actually produce. The framework degrades gracefully:
# with n paths you get n-1 independent residuals, and the isolability analysis
# is recomputed for whichever sensor set the engine carries.
# ---------------------------------------------------------------------------
parity_paths:
  speed_density: true            # Path 1 — MAP, IAT, crank speed
  compressor_map: true           # Path 2 — turbo speed, pressure ratio
  fuel_lambda: true              # Path 3 — injector command, UEGO
  intake_restriction: false      # Path 4 — UNAVAILABLE: a FADEC aero-diesel is
                                 # unthrottled. Requires a hot-film MAF or venturi.
                                 # State this honestly rather than faking rho_3.
  independent_residuals: 2       # n-1, with n=3 available paths

# ---------------------------------------------------------------------------
# ENVIRONMENT PRESETS — DRDO's own trial numbers, used as scenario definitions
# ---------------------------------------------------------------------------
environment_presets:
  sea_level_isa:
    altitude_ft: 0
    isa_offset_K: 0
  cruise_11k:
    altitude_ft: 11000
    isa_offset_K: 0
    # provenance: sourced (2026-09-19, was cruise_18k / 18,000 ft, an
    # unsourced "main.py hardcode" demo point). This is DRDO's own published
    # VRDE critical altitude, doing double duty: 100%-throttle here tests the
    # published envelope edge, 72%-throttle here tests that cruise sits
    # safely inside it. See backend/gates_check.py's module docstring for
    # the full derivation (why 18kft demanded an unrealistic PR~2.7 from a
    # correctly-sized single-stage turbo).
    note: "DRDO published critical altitude — cruise reference point"
  leh_hot_high:
    altitude_ft: 17664           # published: Changla trial ceiling
    isa_offset_K: 20             # ISA+20
    note: "DRDO Leh / Changla high-altitude trial condition"
  ceiling_28k:
    altitude_ft: 28000
    isa_offset_K: 0
    note: "TAPAS BH-201 demonstrated ceiling; far above critical altitude"
